<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MM HCM Team</title>
    <!-- Firebase Compatibility Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { font-size: 18px; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; color: #60a5fa; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 16px; cursor: pointer; }
        .pkg-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #ef4444; width: auto; padding: 6px 12px; margin: 0; font-size: 12px; }
        .btn-logout { background: #475569; margin-top: 20px; }
    </style>
</head>
<body>

<div class="admin-card">
    <!-- Login Box -->
    <div id="login-section">
        <h2>🔒 Admin Login</h2>
        <label>Admin Email</label>
        <input type="email" id="admin-email" placeholder="admin@example.com">
        <label>Password</label>
        <input type="password" id="admin-pass" placeholder="Password ထည့်ပါ">
        <button onclick="login()">Login ဝင်မည်</button>
    </div>

    <!-- Panel Content -->
    <div id="panel-section" style="display: none;">
        <h2>⚙️ Website Settings</h2>
        <label>Telegram Username (မပါဘဲ)</label>
        <input type="text" id="tg-user" placeholder="akuma_edu">

        <label>KBZ Pay Account Name</label>
        <input type="text" id="kbz-name">
        <label>KBZ Pay Phone Number</label>
        <input type="text" id="kbz-phone">

        <label>Wave Money Account Name</label>
        <input type="text" id="wave-name">
        <label>Wave Money Phone Number</label>
        <input type="text" id="wave-phone">

        <button onclick="saveSettings()" style="background: #10b981;">Save Settings</button>

        <h2 style="margin-top: 24px;">➕ Add / Manage Packages</h2>
        <label>Category ရွေးချယ်ပါ</label>
        <select id="pkg-cat">
            <option value="💎 Unlimited Packages">💎 Unlimited Packages</option>
            <option value="📦 No Expire Packages">📦 No Expire Packages</option>
            <option value="⏳ 30 Days Packages">⏳ 30 Days Packages</option>
            <option value="⏳ 15 Days Packages">⏳ 15 Days Packages</option>
        </select>

        <label>Package Name (ဥပမာ - 100 GB)</label>
        <input type="text" id="pkg-name">

        <label>Price (ဥပမာ - 5,000 MMK)</label>
        <input type="text" id="pkg-price">

        <label>Badge Label (Optional)</label>
        <input type="text" id="pkg-badge" placeholder="POPULAR / BEST VALUE">

        <button onclick="addPackage()">+ Add Package</button>

        <h2 style="margin-top: 24px;">📋 Existing Packages</h2>
        <div id="pkg-list">Loading...</div>

        <button class="btn-logout" onclick="logout()">Logout ထွက်မည်</button>
    </div>
</div>

<script>
    // ⚠️ မိမိ၏ Firebase Config အချက်အလက်များဖြင့် အစားထိုးပါ
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // HTML Escape to prevent XSS Attacks
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Auth State Monitor
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('panel-section').style.display = 'block';
            loadData();
        } else {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('panel-section').style.display = 'none';
        }
    });

    function login() {
        const email = document.getElementById('admin-email').value;
        const pass = document.getElementById('admin-pass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => {
            alert("Login မအောင်မြင်ပါ: " + err.message);
        });
    }

    function logout() {
        auth.signOut();
    }

    function loadData() {
        db.ref('settings').once('value', snapshot => {
            const s = snapshot.val();
            if(s) {
                document.getElementById('tg-user').value = s.telegramUsername || '';
                document.getElementById('kbz-name').value = s.kbzName || '';
                document.getElementById('kbz-phone').value = s.kbzPhone || '';
                document.getElementById('wave-name').value = s.waveName || '';
                document.getElementById('wave-phone').value = s.wavePhone || '';
            }
        });

        db.ref('packages').on('value', snapshot => {
            const pkgs = snapshot.val();
            const list = document.getElementById('pkg-list');
            list.innerHTML = '';
            if(!pkgs) return list.innerText = 'Package မရှိသေးပါ။';

            Object.keys(pkgs).forEach(key => {
                const p = pkgs[key];
                const safeName = escapeHtml(p.name);
                const safePrice = escapeHtml(p.price);
                const safeCategory = escapeHtml(p.category);

                list.innerHTML += `
                    <div class="pkg-item">
                        <div>
                            <b>${safeName}</b> (${safePrice})<br>
                            <small style="color:#94a3b8;">${safeCategory}</small>
                        </div>
                        <button class="btn-del" onclick="deletePackage('${key}')">Delete</button>
                    </div>
                `;
            });
        });
    }

    function saveSettings() {
        db.ref('settings').set({
            telegramUsername: document.getElementById('tg-user').value.trim(),
            kbzName: document.getElementById('kbz-name').value.trim(),
            kbzPhone: document.getElementById('kbz-phone').value.trim(),
            waveName: document.getElementById('wave-name').value.trim(),
            wavePhone: document.getElementById('wave-phone').value.trim()
        }).then(() => alert("Settings Saved!")).catch(err => alert("Error: " + err.message));
    }

    function addPackage() {
        const name = document.getElementById('pkg-name').value.trim();
        const price = document.getElementById('pkg-price').value.trim();
        const category = document.getElementById('pkg-cat').value;
        const badge = document.getElementById('pkg-badge').value.trim();

        if(!name || !price) return alert("အချက်အလက် အပြည့်အစုံ ဖြည့်ပါ။");

        db.ref('packages').push({ name, price, category, badge, createdAt: Date.now() })
        .then(() => {
            document.getElementById('pkg-name').value = '';
            document.getElementById('pkg-price').value = '';
            document.getElementById('pkg-badge').value = '';
            alert("Package Added!");
        }).catch(err => alert("Error: " + err.message));
    }

    function deletePackage(key) {
        if(confirm("ဖျက်မှာ သေချာပါသလား?")) {
            db.ref('packages/' + key).remove();
        }
    }
</script>

</body>
</html>
